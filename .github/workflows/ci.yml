name: CI

on:
  push:
    branches: ["main", "feat/**", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # Install from pyproject.toml so packaging breakage fails here. The tests import
      # `task_dispatcher.cli` as an installed package rather than loading the file by
      # path, so this step is also what makes them runnable at all.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # The pytest suite. One step, because pytest reports EVERY failure in the run
      # rather than stopping at the first — which is the property the per-file steps
      # below exist to provide, and the reason those cannot simply be folded in here.
      - name: unit tests
        run: pytest

      # Each of the three below is its own step. These are standalone scripts with their
      # own check() harness, not pytest tests, and they exit non-zero on failure. Running
      # them in one step would let an early failure mask the ones after it — and a
      # multi-command step that stops at the first failure reports "the suite ran" when it
      # did not.
      #
      # They are NOT being migrated to pytest. Each redirects $HOME and imports the
      # dispatcher at module scope with a setup specific to what it pins, and the value of
      # rewriting 1,182 lines of working, carefully-commented tests is zero coverage and a
      # non-zero chance of losing an assertion. conftest.py's collect_ignore keeps pytest
      # from importing them; tests/test_ci_wiring.py asserts each one is still named here,
      # so moving a file into collect_ignore cannot silently stop running it.
      - name: agent launch policy
        run: python tests/test_agent_launch_policy.py

      - name: dispatcher headless chain
        run: python tests/test_dispatcher_headless_chain.py

      - name: --version without a roster
        run: python tests/test_version_no_roster.py

  # SEPARATE JOB, because it is the only one that installs from a git+https ref and so
  # the only one that can go red for a network or upstream reason rather than for a
  # defect in this commit. Folding it into `test` would make a GitHub outage look like a
  # broken emitter.
  #
  # This is the job that would have caught vikunja#550. The `bus` extra named a
  # distribution that does not exist, so it never resolved; cli.py catches ImportError and
  # degrades to a no-op logger, and six event types went missing from the signed audit
  # trail for the whole life of v1.0.0 with every check green. Installing the extra is not
  # enough on its own — the test asserts the import actually bound the real client and
  # that calling it writes a chained record.
  bus-emitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install with the bus extra
        run: pip install -e ".[dev,bus]"

      # Proves the extra resolved to the real distribution before the test runs, so a
      # failure below is about wiring rather than about installation.
      - name: The extra resolved
        run: |
          pip show agent-bus
          python -c "import agent_bus_client; print(agent_bus_client.__file__)"

      - name: bus emitter is live
        run: python tests/test_bus_emitter_live.py

  # Coverage is a floor, not a report. It was configured in pyproject.toml and measured
  # by nobody, so it drifted unobserved.
  #
  # 96, and the number is the MEASURED value of what this build ships (96.64%), not an
  # aspirational one — same rule as when this job was added at 46 and raised to 94. The
  # build plan asked for 80; 80 would pass today while allowing sixteen points of silent
  # regression, which is the failure mode a floor exists to prevent. It is a ratchet:
  # raise it when the measured value rises, and never lower it to make a commit go green.
  #
  # `precision = 2` in pyproject.toml is what makes this safe to set close to the measured
  # value. At precision 0 a real regression of half a point hides inside a rounding
  # boundary — this repo has already crossed one (46.56% displaying as "47").
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Two measured passes, combined. The pytest suite runs as one process; the three
      # standalone scripts each run as their own, because that is what they are.
      #
      # THE PYTEST STEP NEEDS NO ALLOWLIST — a new pytest file is collected, and therefore
      # measured, automatically. That was the point of the glob this replaces, and it is
      # preserved rather than lost.
      #
      # The three names below are spelled out instead of globbed because they are now a
      # closed and shrinking set, and because a glob over tests/ would also match the
      # pytest files and run each as a bare script: that exits 0 having executed no
      # assertions and contributes no coverage, which looks identical to success.
      # tests/test_ci_wiring.py asserts this list stays in step with conftest's
      # collect_ignore, so a file cannot end up in neither.
      #
      # Three test files are measured by NEITHER pass, and each exclusion is because this
      # job deliberately does not provide what they need:
      #
      #   test_gitleaks_gate.py       needs the gitleaks binary, installed only in
      #                               `secret-scan`. This exclusion is not theoretical —
      #                               it is what made this job's first run red.
      #   test_task_queue_vocabulary  reads task-queue-mcp's vocabulary over the network;
      #                               it lives in its own job precisely so an upstream
      #                               change is not confusable with a defect here.
      #   test_bus_vocabulary.py      same, against agent-bus's event_vocab.py.
      #   test_bus_emitter_live.py    needs the git+https `bus` extra. Coupling the floor
      #                               to a network install makes the gate flaky in the one
      #                               direction that matters — a spurious red teaches
      #                               people to ignore it.
      #
      # None of the three contributes coverage anyway: each runs the dispatcher in a
      # subprocess or not at all. They are excluded so the job cannot fail for a reason
      # that is not about coverage.
      - name: Measure the pytest suite
        run: coverage run -p -m pytest -q

      - name: Measure the standalone scripts
        run: |
          for t in tests/test_agent_launch_policy.py \
                   tests/test_dispatcher_headless_chain.py \
                   tests/test_version_no_roster.py; do
            test -f "$t" || { echo "::error::$t is named in ci.yml but does not exist"; exit 1; }
            echo "--- $t"
            coverage run -p --source=task_dispatcher "$t" > /dev/null
          done
          coverage combine

      - name: Report and enforce the floor
        run: coverage report --fail-under=96

  # Secret scanning ran only on the developer's workstation before this. The config
  # shipped; nothing in CI executed it, so the repo had a leak gate in name only — on a
  # public remote. This job runs the scan over full history AND asserts the gate still
  # fires on a planted secret, because a scanner that has silently stopped matching
  # reports the same green as a clean tree.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history — the tip being clean says nothing about history

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The gate must be proven able to fire BEFORE its clean result is believed.
      - name: Gate fires on a planted secret
        run: python tests/test_gitleaks_gate.py

      - name: Scan full history
        run: gitleaks detect --source . --redact --config .gitleaks.toml

  # SEPARATE JOB ON PURPOSE. This one goes red when task-queue-mcp's vocabulary changes
  # upstream — that is an alarm about the world, not about this commit, and it must not
  # be confusable with a genuine regression in the job above. It is also the only check
  # here that needs the network.
  #
  # It reads the upstream over HTTPS from raw.githubusercontent.com. It does NOT need a
  # second actions/checkout of TadMSTR/task-queue-mcp: the build plan said it read a
  # sibling checkout, but the test fetches by URL (see its module docstring) and already
  # fails hard — never skips — when the upstream is unreadable.
  vocabulary-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # TASK_QUEUE_MCP_REF is deliberately NOT set — it defaults to `main`, which is the
      # only ref that proves parity with what is deployed. See the test's docstring.
      - name: task queue vocabulary parity
        run: python tests/test_task_queue_vocabulary.py

  # SEPARATE JOB, for the same reason as vocabulary-parity above and NOT folded into it:
  # they read two different upstreams. Sharing a job would mean an agent-bus change and a
  # task-queue-mcp change produce the same red, and the first failure would stop the
  # second from running at all — so "which upstream moved" would need a log dive on every
  # occurrence.
  #
  # This is the gate that would have caught `task.workflow_started`, emitted here for
  # months while absent from agent-bus's vocabulary. It reached the cross-agent log by
  # accident (see the test's docstring); agent-bus v0.4.0 made that accident a rejection
  # under AGENT_BUS_STRICT_VOCAB=enforce.
  bus-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # AGENT_BUS_REF is deliberately NOT set — it defaults to `main`. A pipeline pinned
      # to a feature branch would assert agreement with something nobody is running.
      - name: bus event vocabulary parity
        run: python tests/test_bus_vocabulary.py
