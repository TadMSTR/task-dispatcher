name: CI

on:
  push:
    branches: ["main", "feat/**", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # Install from pyproject.toml so packaging breakage fails here. The tests import
      # `task_dispatcher.cli` as an installed package rather than loading the file by
      # path, so this step is also what makes them runnable at all.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # Each test is its own step. These are standalone scripts with their own check()
      # harness, not a pytest suite, and they exit non-zero on failure. Running them in
      # one step would let an early failure mask the ones after it — and a multi-command
      # step that stops at the first failure reports "the suite ran" when it did not.
      - name: agent launch policy
        run: python tests/test_agent_launch_policy.py

      - name: dispatcher headless chain
        run: python tests/test_dispatcher_headless_chain.py

      - name: --version without a roster
        run: python tests/test_version_no_roster.py

  # Secret scanning ran only on the developer's workstation before this. The config
  # shipped; nothing in CI executed it, so the repo had a leak gate in name only — on a
  # public remote. This job runs the scan over full history AND asserts the gate still
  # fires on a planted secret, because a scanner that has silently stopped matching
  # reports the same green as a clean tree.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history — the tip being clean says nothing about history

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The gate must be proven able to fire BEFORE its clean result is believed.
      - name: Gate fires on a planted secret
        run: python tests/test_gitleaks_gate.py

      - name: Scan full history
        run: gitleaks detect --source . --redact --config .gitleaks.toml

  # SEPARATE JOB ON PURPOSE. This one goes red when task-queue-mcp's vocabulary changes
  # upstream — that is an alarm about the world, not about this commit, and it must not
  # be confusable with a genuine regression in the job above. It is also the only check
  # here that needs the network.
  #
  # It reads the upstream over HTTPS from raw.githubusercontent.com. It does NOT need a
  # second actions/checkout of TadMSTR/task-queue-mcp: the build plan said it read a
  # sibling checkout, but the test fetches by URL (see its module docstring) and already
  # fails hard — never skips — when the upstream is unreadable.
  vocabulary-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # TASK_QUEUE_MCP_REF is deliberately NOT set — it defaults to `main`, which is the
      # only ref that proves parity with what is deployed. See the test's docstring.
      - name: task queue vocabulary parity
        run: python tests/test_task_queue_vocabulary.py
