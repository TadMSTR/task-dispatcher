# gitleaks config for task-dispatcher.
#
# Baseline rules plus the credential NAMES this codebase legitimately mentions. The
# dispatcher resolves SCOPED_MCP_BEARER_TOKEN and ANTHROPIC_API_KEY from per-agent
# environment files at runtime; it never contains a value for either, and the tests
# assert it refuses to launch when one is unresolved. Allowlisting the names keeps the
# scan useful — a scanner that always fires gets ignored, which is how a real leak ships.

[extend]
useDefault = true

# Deliberately matches the CLASS of internal hostname, not specific ones. Naming the
# operator's actual domains in a public config file would itself be the disclosure this
# rule exists to prevent. Host-side scanning can extend this with a private config.
[[rules]]
id = "internal-hostname"
description = "Internal or private-network hostname"
regex = '''(?i)\bhttps?://[a-z0-9.-]+\.(?:local|internal|lan|home|corp|intranet)\b'''
tags = ["topology"]

[[rules]]
id = "rfc1918-address"
description = "Private network address"
regex = '''\b(?:10\.\d{1,3}|192\.168|172\.(?:1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'''
tags = ["topology"]

# NO ALLOWLIST — and that is deliberate, not an omission.
#
# This file previously carried an [allowlist] block naming the credential VARIABLES this
# codebase legitimately mentions (SCOPED_MCP_BEARER_TOKEN, ANTHROPIC_API_KEY, ...), on the
# theory that a scanner which always fires gets ignored. It was removed after testing it:
# on the pinned gitleaks version a global allowlist suppresses nothing — not the default
# ruleset, and not even the two custom rules defined above. Both the [allowlist] and
# [[allowlists]] spellings were tried, with regexTarget unset, "secret", "match" and
# "line". A co-located secret was detected in every one of the twelve combinations.
#
# It failed safe, so nothing was ever masked. But a config block that documents a
# protection it does not provide is worse than no block: the next reader trusts it. The
# repo scans clean without it, so it is gone.
#
# tests/test_gitleaks_gate.py asserts the behaviour rather than the configuration — that
# the gate fires on a secret co-located with those same variable names. If a future
# gitleaks version starts honouring global allowlists, that test still holds, because it
# tests what the gate DOES.
