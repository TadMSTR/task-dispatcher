[project]
name = "task-dispatcher"
version = "1.1.0"
description = "Forge task dispatcher — the launch-control plane for the agent fleet"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28,<0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# agent-bus is the event-log write path for code that cannot call MCP directly. Optional
# on purpose: the dispatcher degrades to a no-op logger without it (see cli.py), and it is
# not on PyPI, so a hard dependency would make this package uninstallable wherever the VCS
# ref is unreachable — a private CI runner, an air-gapped host.
#
# THE NAME WAS WRONG UNTIL v1.1.0. This asked for `agent-bus-client`, which is not a
# distribution that exists anywhere; the real name is `agent-bus`. So the extra could never
# resolve, and because cli.py catches ImportError and degrades silently, nothing ever said
# so. Five event types went missing from the signed audit trail for the whole life of
# v1.0.0. tests/test_bus_emitter_live.py is what makes a repeat loud.
#
# Pinned by commit SHA, not by the `v0.3.1` tag it points at: git tags are mutable on
# GitHub, and this installs into a root-owned venv on forge.
bus = [
    "agent-bus @ git+https://github.com/TadMSTR/agent-bus@3a2254533012ae08443952a4bcfee3fc5e044a12",
]
dev = ["ruff==0.16.0", "coverage>=7.0", "pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
task-dispatcher = "task_dispatcher:_console"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]

# The pytest suite covers the units. It does NOT cover the six standalone scripts in
# tests/ — those predate it, each redirects $HOME and runs its own check() harness at
# import, and each is still its own CI step so a failure stays attributable to one file.
# conftest.py's collect_ignore keeps pytest from importing them; ci.yml keeps running them.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["task_dispatcher"]

[tool.coverage.report]
show_missing = true
# Two decimals because the CI floor is a ratchet and the next build (vikunja#551) raises
# it. At precision 0 the reported number rounds, so a real regression of half a point can
# hide inside a rounding boundary — and a real improvement of half a point cannot be
# claimed. This build hit exactly that: 46.56% displayed as "47".
precision = 2
